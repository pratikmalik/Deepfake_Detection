services:
  - type: web
    name: deepfake-detection-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 120 backend.server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: OMP_NUM_THREADS
        value: "1"
