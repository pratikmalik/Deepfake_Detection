services:
  - type: web
    name: deepfake-detection-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 backend.server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
